name: CI

on:
  push:
  pull_request:

jobs:
  # Rápido y sin Docker: da señal de lógica rota en menos de un minuto.
  pruebas-unitarias:
    name: Pruebas unitarias y análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, probar y analizar
        run: mvn -B verify -DskipITs

  # Lento: levanta un MySQL 8.4 con Testcontainers (Docker viene en el runner).
  # Checkstyle y SpotBugs ya corrieron en el otro job, no se repiten aquí.
  pruebas-integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Probar contra MySQL efímero
        run: mvn -B verify -Dcheckstyle.skip -Dspotbugs.skip
